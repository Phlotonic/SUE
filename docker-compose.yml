name: sue-platform

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sue
      POSTGRES_PASSWORD: sue
      POSTGRES_DB: sue
    ports:
      - "5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sue -d sue"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
